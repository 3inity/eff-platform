<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101c4e" />
      <stop offset="100%" stop-color="#1a237e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#e5b53e" />
      <stop offset="100%" stop-color="#997010" />
    </linearGradient>
  </defs>

  <!-- Outer Shield -->
  <path d="M 30 40 L 270 40 C 270 200 150 310 150 330 C 150 310 30 200 30 40 Z" fill="url(#shieldBg)" stroke="url(#gold)" stroke-width="10" />
  
  <!-- Inner Shield Line -->
  <path d="M 50 60 L 250 60 C 250 190 150 280 150 295 C 150 280 50 190 50 60 Z" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" />
  
  <!-- Diagonal Half Tint -->
  <path d="M 150 60 L 250 60 C 250 190 150 280 150 295 Z" fill="#ffffff" fill-opacity="0.08" />
  
  <!-- Center Star -->
  <polygon points="150,110 162,146 200,146 169,168 181,204 150,182 119,204 131,168 100,146 138,146" fill="url(#gold)" />
  
  <!-- Football -->
  <circle cx="150" cy="235" r="24" fill="#ffffff" stroke="#0a1128" stroke-width="4" />
  <polygon points="150,222 163,231 158,245 142,245 137,231" fill="#0a1128" />
</svg>
