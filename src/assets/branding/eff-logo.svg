<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101c4e" />
      <stop offset="100%" stop-color="#1a237e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270" />
      <stop offset="50%" stop-color="#e5b53e" />
      <stop offset="100%" stop-color="#b88618" />
    </linearGradient>
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b4ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="235" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="14" filter="url(#shadow)" />
  
  <!-- Inner Decorative Ring -->
  <circle cx="250" cy="250" r="205" fill="none" stroke="url(#electricBlue)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
  
  <!-- Banner Ribbons Top & Bottom -->
  <path d="M 120 75 Q 250 40 380 75" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="250" y="110" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">EINITY FOOTBALL FEDERATION</text>
  
  <!-- Central Shield -->
  <path d="M 150 160 L 350 160 C 350 290 250 360 250 380 C 250 360 150 290 150 160 Z" fill="#0d1b47" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />
  
  <!-- EFF Monogram -->
  <text x="250" y="295" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">EFF</text>
  
  <!-- Football icon bottom -->
  <circle cx="250" cy="425" r="22" fill="#fff" stroke="#0a1128" stroke-width="4" />
  <polygon points="250,412 262,421 257,435 243,435 238,421" fill="#0a1128" />
</svg>
