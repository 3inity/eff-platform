<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101c4e" />
      <stop offset="100%" stop-color="#1a237e" />
    </linearGradient>
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b4ff" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270" />
      <stop offset="100%" stop-color="#e5b53e" />
    </linearGradient>
    <pattern id="diagonalStripes" width="40" height="40" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1e293b" stroke-width="8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#diagonalStripes)" />
  
  <!-- Geometric Angled Accents -->
  <polygon points="0,0 260,0 120,400 0,400" fill="url(#electricBlue)" opacity="0.6" />
  <polygon points="1050,0 1200,0 1200,400 950,400" fill="url(#gold)" opacity="0.7" />
  
  <!-- Subtle Center Crest Watermark -->
  <circle cx="600" cy="200" r="160" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.2" />
  
  <!-- Frame Accents -->
  <line x1="0" y1="390" x2="1200" y2="390" stroke="url(#electricBlue)" stroke-width="6" />
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#gold)" stroke-width="2" opacity="0.5" />
  
  <!-- EFF Watermark Branding Text -->
  <text x="600" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="120" font-weight="900" fill="#ffffff" fill-opacity="0.05" text-anchor="middle" letter-spacing="16">EFF LEAGUE</text>
</svg>
